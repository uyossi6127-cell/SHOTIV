    <div class="splash-brand">
      <span class="splash-word">Shot<span class="wm-b">iv</span></span>

  <main id="app" aria-live="polite"></main>

  <!-- מסך הרשמה ראשונית (S1) -->
  <!-- הרשמה: פרטי משתמש -->
  <template id="tpl-register">
    <form class="screen register" id="register-form" novalidate>
      <header class="stack-sm register-head">
        <h1 class="wordmark">Shot<span class="wm-b">iv</span></h1>
        <h2 data-reg-title>יצירת חשבון</h2>
        <p class="muted">כמה פרטים קצרים, ואז נכיר את הטיפול שלך.</p>
      </header>

      <label class="field">שם מלא
        <input name="fullName" type="text" autocomplete="name" required placeholder="ישראל ישראלי" maxlength="60">
      </label>
      <label class="field">גיל
        <input name="age" type="number" inputmode="numeric" min="18" max="120" step="1" required placeholder="50">
      </label>
      <label class="field">אימייל
        <input name="email" type="email" inputmode="email" autocomplete="email" dir="ltr" required placeholder="name@example.com" maxlength="100">
      </label>

      <p class="muted small-text register-note">הפרטים נשמרים רק בטלפון שלך. לא שולחים אותם לשום מקום.</p>
      <p class="error" id="register-error" role="alert" hidden></p>

      <div class="spacer"></div>
      <button class="btn primary" type="submit" data-reg-btn>הרשמה</button>
    </form>
  </template>

  <template id="tpl-onboarding">
    <form class="screen onboarding" id="onboarding-form" novalidate>
      <header class="stack-sm">
        <h1>בוא נכיר את הטיפול שלך</h1>
        <p class="muted">אנחנו רק מתעדים. את המינון קובע הרופא.</p>
      </header>

      <fieldset class="field">
        <legend>מגדר</legend>
        <div class="choice-grid two">
          <label class="choice"><input type="radio" name="gender" value="female" required><span>אישה</span></label>
          <label class="choice"><input type="radio" name="gender" value="male"><span>גבר</span></label>
        </div>
      </fieldset>

      <fieldset class="field">
        <legend>סוג התרופה</legend>
        <div class="choice-grid three">
          <label class="choice"><input type="radio" name="med" value="מונג'רו" required><span>מונג'רו</span></label>
          <label class="choice"><input type="radio" name="med" value="וויגובי"><span>וויגובי</span></label>
          <label class="choice"><input type="radio" name="med" value="אחר"><span>אחר</span></label>
        </div>
      </fieldset>

      <div class="grid-two">
        <label class="field">מינון נוכחי (מ"ג)
          <input name="dose" type="number" inputmode="decimal" step="0.25" min="0" required placeholder="5">
        </label>
        <label class="field">יום הזריקה
          <select name="shotDay" required>
            <option value="0">ראשון</option>
            <option value="1">שני</option>
            <option value="2">שלישי</option>
            <option value="3">רביעי</option>
            <option value="4">חמישי</option>
            <option value="5">שישי</option>
            <option value="6">שבת</option>
          </select>
        </label>
        <label class="field">משקל נוכחי (ק"ג)
          <input name="startWeight" type="number" inputmode="decimal" step="0.1" min="30" max="300" required placeholder="108">
        </label>
        <label class="field">משקל יעד (ק"ג)
          <input name="goalWeight" type="number" inputmode="decimal" step="0.1" min="30" max="300" required placeholder="99">
        </label>
      </div>

      <label class="field">שעת תזכורת ביום הזריקה
        <input name="shotTime" type="time" value="20:00" required>
      </label>

      <p class="error" id="onboarding-error" role="alert" hidden></p>

      <div class="spacer"></div>
      <button class="btn primary" type="submit">שמור והמשך</button>
    </form>
  </template>

  <!-- מסך בית (S2) -->
  <template id="tpl-home">
    <section class="screen home">
      <header class="home-top">
        <div class="stack-xs">
          <span class="muted" data-greeting></span>
          <h1 class="wordmark">Shot<span class="wm-b">iv</span></h1>
        </div>
        <a class="btn ghost small" href="#settings">הגדרות</a>
      </header>

      <article class="card next-shot">
        <span class="label-light">הזריקה הבאה</span>
        <p class="countdown"><strong data-days></strong> <span data-days-word></span></p>
        <p data-shot-meta></p>
        <button class="btn light" type="button" data-action="log-shot">רשום זריקה</button>
        <a class="last-shot" href="#history" data-last-shot hidden></a>
      </article>

      <article class="card reminder" data-reminder-card hidden>
        <div class="stack-xs">
          <h2>תזכורת שבועית</h2>
          <p class="muted small-text" data-reminder-text></p>
        </div>
        <button class="btn outline" type="button" data-action="add-calendar">הוסף ליומן בטלפון</button>
        <button class="link-btn" type="button" data-action="calendar-done">כבר הוספתי</button>
      </article>

      <article class="card progress-card">
        <div class="row-between">
          <h2>ההתקדמות שלך</h2>
          <span class="muted small-text" data-goal></span>
        </div>
        <dl class="stats">
          <div><dt>עכשיו</dt><dd data-now></dd></div>
          <div><dt>ירדת</dt><dd class="accent" data-lost></dd></div>
          <div><dt>נשאר</dt><dd data-left></dd></div>
        </dl>
        <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" data-progress-bar>
          <div class="progress-fill" data-progress-fill></div>
        </div>
        <p class="muted small-text" data-progress-text></p>
        <a class="btn green" href="#weight">עדכון משקל</a>
      </article>

      <p class="note" data-motivation></p>

      <a class="weigh-nudge" href="#weight" data-weigh-nudge hidden>
        <strong>הגיע הזמן להישקל</strong>
        <span data-weigh-nudge-text></span>
      </a>

      <a class="backup-nudge" href="#settings" data-backup-nudge hidden>
        <strong>כדאי לגבות את הנתונים</strong>
        <span data-backup-nudge-text></span>
      </a>
    </section>
  </template>

  <!-- רישום זריקה (S3) -->
  <template id="tpl-log">
    <form class="screen log" id="log-form" novalidate>
      <header class="row-between">
        <h1>רישום זריקה</h1>
        <a class="btn ghost small" href="#home">חזרה</a>
      </header>

      <article class="card">
        <div class="row-between">
          <span class="muted">תרופה ומינון</span>
          <a class="small-link" href="#dose">שינוי מינון</a>
        </div>
        <p class="big-line" data-med-dose></p>
        <p class="muted small-text">לפי המינון שהרופא קבע</p>
      </article>

      <fieldset class="card">
        <legend class="muted card-legend">מתי</legend>
        <div class="choice-grid two">
          <label class="choice"><input type="radio" name="when" value="today" checked><span>היום</span></label>
          <label class="choice"><input type="radio" name="when" value="other"><span>תאריך אחר</span></label>
        </div>
        <label class="field" data-other-date hidden>תאריך הזריקה
          <input type="date" name="date">
        </label>
      </fieldset>

      <fieldset class="card">
        <legend class="sr-only">אזור ההזרקה</legend>
        <div class="row-between">
          <span class="muted" aria-hidden="true">אזור ההזרקה</span>
          <span class="muted small-text" data-last-site></span>
        </div>
        <div class="choice-grid two" data-sites></div>
        <p class="muted small-text">כדאי להחליף אזור בכל פעם. סימנו את האזור המומלץ.</p>
      </fieldset>

      <p class="error" id="log-error" role="alert" hidden></p>
      <div class="spacer"></div>
      <button class="btn primary" type="submit">שמור זריקה</button>
    </form>
  </template>

  <!-- היסטוריית זריקות (S14) -->
  <template id="tpl-history">
    <section class="screen history-screen">
      <header class="row-between">
        <h1>היסטוריית זריקות</h1>
        <a class="btn ghost small" href="#home">חזרה</a>
      </header>
      <p class="muted" data-history-summary></p>
      <ul class="shot-list" data-shot-list></ul>
      <p class="note" data-history-empty hidden>עדיין לא נרשמו זריקות.</p>
    </section>
  </template>

  <!-- שקילה וגרף (S5, S6) -->
  <template id="tpl-weight">
    <section class="screen weight">
      <header class="row-between">
        <h1>עדכון משקל</h1>
        <a class="btn ghost small" href="#home">חזרה</a>
      </header>

      <div class="feedback" data-feedback role="status" hidden>
        <span class="feedback-icon" aria-hidden="true" data-feedback-icon></span>
        <div class="stack-xs">
          <strong data-feedback-title></strong>
          <span data-feedback-text></span>
        </div>
      </div>

      <article class="card">
        <span class="muted">המשקל היום</span>
        <div class="stepper">
          <button class="step-btn" type="button" data-step="0.1" aria-label="הוסף 0.1 קילו">+</button>
          <label class="weight-input">
            <span class="sr-only">משקל בקילוגרמים</span>
            <input type="number" inputmode="decimal" step="0.1" min="30" max="300" data-weight-input>
            <span aria-hidden="true">ק"ג</span>
          </label>
          <button class="step-btn" type="button" data-step="-0.1" aria-label="הפחת 0.1 קילו">−</button>
        </div>
        <p class="error" data-weight-error role="alert" hidden></p>
        <button class="btn green big" type="button" data-action="save-weight">שמור משקל</button>
        <p class="muted small-text" data-today-note hidden>כבר נשקלת היום. שמירה תעדכן את השקילה של היום.</p>
      </article>

      <article class="card">
        <div class="row-between">
          <h2>ההתקדמות שלך</h2>
          <span class="lost-badge" data-lost-badge></span>
        </div>
        <div class="chart" data-chart></div>
        <p class="pace" data-pace hidden></p>
      </article>

      <article class="card" data-recent-card hidden>
        <h2>שקילות אחרונות</h2>
        <ul class="history" data-recent></ul>
      </article>
    </section>
  </template>

  <!-- הגדרות וגיבוי (S15) -->
  <template id="tpl-settings">
    <section class="screen settings">
      <header class="row-between">
        <h1>הגדרות</h1>
        <a class="btn ghost small" href="#home">חזרה</a>
      </header>

      <form class="card account" id="account-form" novalidate>
        <h2>פרטי החשבון</h2>
        <label class="field">שם מלא
          <input name="fullName" type="text" autocomplete="name" required maxlength="60">
        </label>
        <label class="field">גיל
          <input name="age" type="number" inputmode="numeric" min="18" max="120" step="1" required>
        </label>
        <label class="field">אימייל
          <input name="email" type="email" inputmode="email" autocomplete="email" dir="ltr" required maxlength="100">
        </label>
        <p class="error" data-account-error role="alert" hidden></p>
        <p class="muted small-text" data-account-ok hidden>נשמר ✓</p>
        <button class="btn outline" type="submit">שמירת פרטים</button>
      </form>

      <article class="card reminder">
        <h2>תזכורות ביומן</h2>
        <p class="muted small-text">אירוע קבוע ביומן של הטלפון. היומן מתריע גם כשהאפליקציה סגורה.</p>
        <button class="btn outline" type="button" data-action="cal-shot">תזכורת לזריקה</button>
        <p class="muted small-text" data-cal-shot-text></p>
        <button class="btn outline" type="button" data-action="cal-weight">תזכורת לשקילה</button>
        <p class="muted small-text" data-cal-weight-text></p>
      </article>

      <fieldset class="card">
        <legend class="sr-only">גודל הטקסט</legend>
        <h2 aria-hidden="true">גודל הטקסט</h2>
        <div class="segmented">
          <label class="choice"><input type="radio" name="textSize" value="normal"><span>רגיל</span></label>
          <label class="choice"><input type="radio" name="textSize" value="large"><span style="font-size: 21px">גדול</span></label>
        </div>
      </fieldset>

      <fieldset class="card">
        <legend class="sr-only">מגדר</legend>
        <h2 aria-hidden="true">מגדר</h2>
        <div class="segmented">
          <label class="choice"><input type="radio" name="genderSetting" value="female"><span>אישה</span></label>
          <label class="choice"><input type="radio" name="genderSetting" value="male"><span>גבר</span></label>
        </div>
      </fieldset>

      <article class="card">
        <h2>גיבוי הנתונים</h2>
        <p class="muted small-text">הנתונים שמורים רק בטלפון הזה. גבה אותם לקובץ ושמור אותו בוואטסאפ, במייל או ב-Drive. אם תחליף טלפון, תוכל לשחזר מהקובץ.</p>
        <p class="small-text" data-last-backup></p>
        <button class="btn primary" type="button" data-action="backup">גבה עכשיו</button>
      </article>

      <article class="card">
        <h2>שחזור מגיבוי</h2>
        <p class="muted small-text">טוען קובץ גיבוי ומחליף את הנתונים שבטלפון.</p>
        <label class="btn outline file-btn">בחר קובץ גיבוי
          <input type="file" accept=".json,application/json" data-action="restore">
        </label>
        <p class="error" data-restore-error role="alert" hidden></p>
      </article>

      <article class="card danger-zone">
        <h2>מחיקת כל הנתונים</h2>
        <p class="muted small-text">מוחק את כל הזריקות, המשקל וההגדרות מהטלפון. אי אפשר לבטל. מומלץ לגבות לפני.</p>
        <button class="btn danger" type="button" data-action="reset">מחק הכל והתחל מחדש</button>
      </article>

      <p class="muted small-text version" data-version></p>
      <p class="muted small-text version">© 2026 Yossi Ozan. כל הזכויות שמורות.</p>
    </section>
  </template>

  <!-- שינוי מינון (S8) -->
  <template id="tpl-dose">
    <form class="screen dose" id="dose-form" novalidate>
      <header class="row-between">
        <h1>שינוי מינון</h1>
        <a class="btn ghost small" href="#log">חזרה</a>
      </header>
      <p class="note">עדכן כאן רק מינון שהרופא קבע. האפליקציה לא ממליצה על מינון.</p>

      <article class="card">
        <span class="muted">המינון הנוכחי</span>
        <p class="big-line" data-current-dose></p>
      </article>

      <label class="field">המינון החדש (מ"ג)
        <input name="dose" type="number" inputmode="decimal" step="0.25" min="0" required>
      </label>

      <p class="error" id="dose-error" role="alert" hidden></p>

      <article class="card" data-history-card hidden>
        <h2>היסטוריית מינונים</h2>
        <ul class="history" data-history></ul>
      </article>

      <div class="spacer"></div>
      <button class="btn primary" type="submit">שמור מינון</button>
    </form>
  </template>

  <script src="app.js?v=36"></script>
</body>
</html>
